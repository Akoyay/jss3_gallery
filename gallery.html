<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSS3 Graduation Gallery</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="logo2.png">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loader">

    <img src="logo.png" class="loader-logo">

    <h2>Loading Gallery...</h2>

    <div class="loader-bar">

        <div class="loader-progress"></div>

    </div>

</div>

<!-- =========================
     IMAGE VIEWER
========================= -->

<div id="imageViewer" class="viewer">

    <span id="closeViewer" class="viewer-close">

        &times;

    </span>

    <img id="viewerImage">

</div>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">

        <img src="logo.png" class="nav-logo">

        <h2>JSS3 Gallery</h2>

    </div>

    <ul class="nav-links">

        <li>

            <a href="index.html" class="home-btn">

                Home

            </a>

        </li>

        <li>

            <button id="uploadBtn">

                Upload Photos

            </button>

        </li>

    </ul>

</nav>

<!-- Hidden File Input -->

<input
type="file"
id="imageInput"
accept="image/*"
multiple
hidden>

<!-- =========================
     HERO
========================= -->

<header class="hero">

    <h1>

        Graduation Gallery

    </h1>

    <p>

        Browse and download graduation memories.

    </p>

</header>

<!-- =========================
     GALLERY
========================= -->

<section class="gallery-container">

    <div
    id="gallery"
    class="gallery-grid">

    </div>

</section>

<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <p>

        &copy; 2026 DESIGNED BY
        <a href="https://akoyay.github.io/korede_dev/"
            target="_blank" rel="noopener" class="footerpp">
            OYERINDE AKOREDE
        </a>
            AND SUPERVISED BY MR CLEMENT
        

    </p>

</footer>

<script type="module" src="script.js"></script>

</body>
</html>
